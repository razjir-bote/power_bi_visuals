name: 'sample_shop'
version: '1.0.0'
config-version: 2

profile: 'sample_shop'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  sample_shop:
    +schema: raw

models:
  sample_shop:
    staging:
      +materialized: view
      +schema: staging
      +meta:
        layer: staging
    marts:
      +materialized: table
      +schema: marts
      +meta:
        layer: marts
        owner: analytics-team
