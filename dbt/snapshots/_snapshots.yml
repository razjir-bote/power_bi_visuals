version: 2

snapshots:
  - name: customers_snapshot
    description: >
      Type 2 slowly changing dimension of customers. A new version is recorded
      whenever first_name, last_name or email changes, so the full history of
      each customer is kept.
    columns:
      - name: customer_id
        description: Customer identifier. Not unique here; there is one row per version of the customer.
      - name: first_name
        description: Customer's first name in this version.
      - name: last_name
        description: Customer's last name in this version.
      - name: email
        description: Customer's email address in this version, lower-cased.
      - name: created_at
        description: Date the customer account was created.
      - name: dbt_scd_id
        description: Unique identifier of this version of the customer, generated by dbt.
      - name: dbt_updated_at
        description: Timestamp dbt recorded for this version when it was captured.
      - name: dbt_valid_from
        description: Timestamp from which this version is valid.
      - name: dbt_valid_to
        description: Timestamp until which this version was valid. Null for the current version.
